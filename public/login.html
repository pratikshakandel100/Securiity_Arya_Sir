<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="card">
  <div class="lock">🔒 Secured with HTTPS/TLS</div>
  <h1>Log in</h1><p class="sub">Enter your credentials.</p>
  <form id="f" novalidate>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <div id="msg" class="msg"></div>
  <div class="link">No account? <a href="/signup.html">Sign up</a></div>
</div><script src="/login.js"></script></body></html>
